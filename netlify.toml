# Blog slug redirect
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

# Proxy /api requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://yt-downloader-backend-n68l.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
